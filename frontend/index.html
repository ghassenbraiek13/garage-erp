<!doctype html>
<html lang="fr">
  <head>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('garageflow-theme') || localStorage.getItem('gf-theme')
          var mode = 'light'
          if (raw) {
            var parsed = JSON.parse(raw)
            if (parsed && parsed.state && parsed.state.theme) mode = parsed.state.theme
          }
          var dark = mode === 'dark'
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <meta
      name="description"
      content="GarageFlow — ERP SaaS pour garages automobiles : clients, véhicules, planning, stock."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />
